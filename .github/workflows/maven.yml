name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: self-hosted

    steps:
    - name: checkout repo
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: install maven and build package
      run: sudo apt update && sudo apt install maven -y && sudo apt clean all && sleep 10s && mvn clean package
      
    - name: upload war file
      uses: actions/upload-artifact@v4
      with:
        name: webapp.war
        path: /runner/_work/hello-world/hello-world/webapp/target/webapp.war