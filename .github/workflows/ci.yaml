#ci for hello world
name: hello world CI


on:
  push:
    branches:
      - master

jobs:
  #build the application using maven
  build:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
     - name: checkout code
       uses: actions/checkout@v7

     - name: Extract tag version
       id: VERSION
       run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
  
     - name: Set up JDK
       uses: actions/setup-java@v4
       with:
         java-version: '17'
         distribution: 'temurin'
         cache: 'maven'
  
     - name: build with maven
       run: mvn clean install
  
     #upload the war file as an artifact to be used in the containerize job
     - name: Upload WAR artifact
       uses: actions/upload-artifact@v4
       with:
         name: webapp-war
         path: webapp/target/*.war
         if-no-files-found: error

     - name: Build Docker image
       run: docker build -t hello-world-app .
  
     #configure the aws credentials to push the docker image to amazon ecr
     - name: Configure AWS Credentials
       uses: aws-actions/configure-aws-credentials@v6.1.0
       with:
         audience: sts.amazonaws.com
         role-to-assume: arn:aws:iam::134448505602:role/hello-world-github-action
         aws-region: ap-south-1
  
     - name: Get caller identity
       run: aws sts get-caller-identity
  
     #login to amazon ecr using the aws credentials configured in the previous step
     - name: Login to Amazon ECR
       id: login-ecr
       uses: aws-actions/amazon-ecr-login@v2
  
     #push the docker image to amazon ecr
     - name: Push Docker image to Amazon ECR
       env:
         REGISTRY: ${{ steps.login-ecr.outputs.registry }}
         REPOSITORY: hello-world-app
         IMAGE_TAG: ${{ env.VERSION }}
       run: |
         docker tag hello-world-app:$IMAGE_TAG $REGISTRY/$REPOSITORY:$IMAGE_TAG
         docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

     - name: Update Helm chart version
       run: |
         sed -i "s/^appVersion:.*/appVersion: \"${{ env.VERSION }}\"/" hello-world-chart/Chart.yaml
         sed -i "s/tag:.*/tag: \"${{ env.VERSION }}\"/" hello-world-chart/values.yaml

     - name: Commit and push updated Helm chart
       run: |
        git config --global user.name "maxpain62"
        git config --global user.email "maxpain62@gmail.com"
        git checkout -b master
        git add hello-world-chart/Chart.yaml
        git add hello-world-chart/values.yaml
        git commit -m "Update Helm chart version to ${{ env.VERSION }}"
        git push origin HEAD:master -f
