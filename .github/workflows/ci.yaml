#ci for hello world
name: hello world CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  #build the application using maven
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v2

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: build with maven
      run: mvn clean install
      
    #upload the war file as an artifact to be used in the containerize job
    - name: Upload WAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapp-war
        path: webapp/target/*.war
        if-no-files-found: error
    
  #containerize the application using docker
  containerize:
    runs-on: ubuntu-latest
    #copy the war file from the build job to the containerize job
    needs: build

    steps:
    - name: checkout code
      uses: actions/checkout@v2

    - name: Download WAR artifact
      uses: actions/download-artifact@v5
      with:
        name: webapp-war
        path: webapp/target

    - name: Build Docker image
      run: docker build -t hello-world-app .

