apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.metadata.labels.app }}-ingress
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
spec:
  ingressClassName: alb
  rules:
    - host: gauravtest.store
      http:
        paths:
          - path: "/webapp"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.metadata.labels.app }}-service
                port:
                  number: {{ .Values.containers.ports.containerPort }}
    - host: webapp.gauravtest.store
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.metadata.labels.app }}-service
                port:
                  number: {{ .Values.containers.ports.containerPort }}